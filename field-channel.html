<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>OnePort 365 · Field Channel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --green-dark:#023819;
  --green-dark-hover:#03571f;
  --green-accent:#BFFB4F;
  --green-accent-hover:#a9e83a;
  --green-light:#D1DBBD;
  --green-light-surface:#F4F6EF;
  --gold:#FFCC1A;
  --gold-bg:#FFF3CC;
  --gold-text:#8a6a00;
  --success:#1F8A5B;
  --success-bg:#E1F1E8;
  --success-text:#0f7a45;
  --error:#FF1A1A;
  --error-bg:#FDE0E0;
  --error-text:#cc1414;
  --cream:#FDFBF1;
  --white:#FFFFFF;
  --silver-light:#808080;
  --silver-dark:#383838;
  --border-tint: rgba(2,56,25,.12);
  --radius-sm:6px; --radius-md:10px; --radius-lg:16px; --radius-xl:22px;
  --shadow-e2: 0 2px 4px rgba(2,56,25,.05), 0 8px 20px -8px rgba(2,56,25,.14);
  --font-display:'Poppins', system-ui, sans-serif;
  --font-body:'Open Sans', system-ui, sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:var(--font-body); color:var(--silver-dark); background:var(--green-light-surface);
  font-size:15px; line-height:1.5; min-height:100vh;
}
h1,h2,h3{font-family:var(--font-display); color:var(--green-dark); margin:0}
button{font-family:var(--font-body); cursor:pointer}
input,textarea{font-family:var(--font-body)}

.app{ max-width:520px; margin:0 auto; min-height:100vh; background:var(--cream); display:flex; flex-direction:column; box-shadow:var(--shadow-e2); position:relative; }

/* ---- Top bar ---- */
.topbar{
  position:sticky; top:0; z-index:20; background:var(--green-dark); color:var(--cream);
  padding:16px 18px; display:flex; align-items:center; gap:10px; min-height:30px;
}
.topbar .back-btn{ background:none; border:none; color:var(--cream); padding:6px; margin:-6px; display:flex; border-radius:var(--radius-sm); }
.topbar .back-btn:active{ background:rgba(255,255,255,.12); }
.topbar h1{ color:var(--cream); font-size:17px; font-weight:600; flex:1; }
.topbar .user-chip{ display:flex; align-items:center; gap:7px; background:rgba(253,251,241,.1); border:none; color:var(--cream); padding:6px 10px 6px 6px; border-radius:999px; font-size:12.5px; font-weight:600; }
.topbar .avatar{ width:24px; height:24px; border-radius:50%; background:var(--green-accent); color:var(--green-dark); display:grid; place-items:center; font-family:var(--font-display); font-weight:700; font-size:11px; flex-shrink:0 }
.topbar .refresh-btn{ background:none; border:none; color:var(--cream); padding:6px; margin:-6px; border-radius:var(--radius-sm); display:flex; }
.topbar .refresh-btn.spinning svg{ animation: spin .8s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ---- Screens ---- */
.screen{ display:none; flex:1; flex-direction:column; }
.screen.active{ display:flex; }

/* ---- Filter tabs ---- */
.filter-bar{ display:flex; gap:8px; padding:12px 16px 4px; }
.filter-chip{
  border:1px solid var(--border-tint); background:var(--white); color:var(--silver-dark);
  padding:7px 14px; border-radius:999px; font-size:13px; font-weight:600; font-family:var(--font-display);
}
.filter-chip.active{ background:var(--green-dark); border-color:var(--green-dark); color:var(--green-accent); }

/* ---- To-Do list ---- */
.list{ padding:8px 16px 100px; display:flex; flex-direction:column; gap:10px; flex:1; }
.ms-card{
  background:var(--white); border:1px solid var(--border-tint); border-radius:var(--radius-lg);
  padding:14px 16px; display:flex; flex-direction:column; gap:6px; text-align:left; width:100%;
}
.ms-card:active{ background:var(--green-light-surface); }
.ms-card .row1{ display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
.ms-card .ms-name{ font-family:var(--font-display); font-weight:600; font-size:15.5px; color:var(--green-dark); }
.ms-card .ship-ref{ font-family:var(--font-display); font-weight:600; font-size:12.5px; color:var(--silver-dark); background:var(--green-light-surface); padding:3px 9px; border-radius:var(--radius-sm); white-space:nowrap; }
.ms-card .meta-row{ display:flex; flex-wrap:wrap; gap:6px 10px; font-size:12.5px; color:var(--silver-light); align-items:center; }
.ms-card .meta-row svg{ vertical-align:-2px; margin-right:3px; }
.status-pill{ display:inline-flex; align-items:center; gap:5px; font-family:var(--font-display); font-weight:600; font-size:11.5px; padding:4px 10px; border-radius:999px; }
.status-pill.not-started{ background:var(--gold-bg); color:var(--gold-text); }
.status-pill.completed{ background:var(--success-bg); color:var(--success-text); }
.due-label{ font-weight:600; }
.due-label.overdue{ color:var(--error); }
.due-label.today{ color:var(--success-text); }

/* ---- Empty state ---- */
.empty-state{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 30px; gap:10px; color:var(--silver-light); }
.empty-state .icon{ width:56px; height:56px; border-radius:50%; background:var(--green-light-surface); display:grid; place-items:center; margin-bottom:6px; }
.empty-state h3{ font-size:16px; }
.empty-state p{ margin:0; font-size:13.5px; max-width:280px; }

/* ---- Detail screen ---- */
.detail-body{ padding:18px 18px 130px; flex:1; overflow-y:auto; }
.detail-status-banner{ display:flex; align-items:center; gap:8px; padding:10px 14px; border-radius:var(--radius-md); font-weight:600; font-size:13.5px; margin-bottom:16px; }
.detail-status-banner.not-started{ background:var(--gold-bg); color:var(--gold-text); }
.detail-status-banner.completed{ background:var(--success-bg); color:var(--success-text); }
.detail-h1{ font-size:21px; margin-bottom:4px; }
.detail-sub{ color:var(--silver-light); font-size:13.5px; margin-bottom:20px; }
.info-card{ background:var(--white); border:1px solid var(--border-tint); border-radius:var(--radius-lg); padding:16px; margin-bottom:14px; }
.info-card h3{ font-size:12.5px; text-transform:uppercase; letter-spacing:.04em; color:var(--silver-light); margin-bottom:10px; font-family:var(--font-body); font-weight:700; }
.info-row{ display:flex; justify-content:space-between; gap:12px; padding:7px 0; border-bottom:1px solid var(--border-tint); font-size:13.5px; }
.info-row:last-child{ border-bottom:none; }
.info-row .k{ color:var(--silver-light); flex-shrink:0; }
.info-row .v{ color:var(--silver-dark); font-weight:600; text-align:right; }
.instruction-text{ font-size:14px; color:var(--silver-dark); line-height:1.6; }
.completion-meta{ font-size:13px; color:var(--silver-light); }
.completion-meta b{ color:var(--green-dark); }
.note-block{ background:var(--green-light-surface); border-radius:var(--radius-md); padding:10px 12px; font-size:13.5px; margin-top:8px; color:var(--silver-dark); }

/* ---- Bottom action bar ---- */
.bottom-bar{ position:sticky; bottom:0; background:var(--cream); border-top:1px solid var(--border-tint); padding:14px 18px calc(14px + env(safe-area-inset-bottom)); }
.btn{ font-family:var(--font-display); font-weight:600; font-size:15px; border-radius:var(--radius-md); border:none; padding:14px 18px; width:100%; display:flex; align-items:center; justify-content:center; gap:8px; }
.btn-primary{ background:var(--green-dark); color:var(--green-accent); }
.btn-primary:active{ background:var(--green-dark-hover); }
.btn-primary:disabled{ opacity:.5; }
.btn-outline{ background:var(--white); color:var(--green-dark); border:1.5px solid var(--border-tint); }
.btn-danger-text{ background:none; color:var(--silver-light); font-weight:600; }

/* ---- Login screen ---- */
.login-screen{ flex:1; display:flex; flex-direction:column; justify-content:center; padding:32px 26px; gap:22px; }
.login-brand{ text-align:center; margin-bottom:8px; }
.login-brand .mark{ width:52px; height:52px; border-radius:14px; background:var(--green-dark); color:var(--green-accent); display:grid; place-items:center; font-family:var(--font-display); font-weight:700; font-size:20px; margin:0 auto 12px; }
.login-brand h1{ font-size:19px; }
.login-brand p{ color:var(--silver-light); font-size:13.5px; margin:4px 0 0; }
.staff-option{ display:flex; align-items:center; gap:12px; background:var(--white); border:1.5px solid var(--border-tint); border-radius:var(--radius-lg); padding:13px 15px; width:100%; text-align:left; }
.staff-option:active{ background:var(--green-light-surface); }
.staff-option .avatar{ width:38px; height:38px; border-radius:10px; background:var(--green-light); color:var(--green-dark); display:grid; place-items:center; font-family:var(--font-display); font-weight:700; font-size:13.5px; flex-shrink:0; }
.staff-option .who .nm{ font-weight:600; color:var(--green-dark); font-size:14.5px; }
.staff-option .who .rl{ font-size:12px; color:var(--silver-light); }
.staff-list{ display:flex; flex-direction:column; gap:9px; }

/* ---- Sheet (confirmation) ---- */
.sheet-overlay{ position:fixed; inset:0; background:rgba(2,56,25,.4); z-index:50; display:none; align-items:flex-end; justify-content:center; }
.sheet-overlay.open{ display:flex; }
.sheet{ background:var(--cream); width:100%; max-width:520px; border-radius:var(--radius-xl) var(--radius-xl) 0 0; padding:20px 20px calc(20px + env(safe-area-inset-bottom)); box-shadow:0 -8px 30px rgba(2,56,25,.2); }
.sheet .handle{ width:36px; height:4px; background:var(--border-tint); border-radius:99px; margin:0 auto 16px; }
.sheet h2{ font-size:18px; margin-bottom:4px; }
.sheet .sheet-sub{ color:var(--silver-light); font-size:13.5px; margin-bottom:16px; }
.sheet textarea{ width:100%; border:1.5px solid var(--border-tint); border-radius:var(--radius-md); padding:10px 12px; font-size:14px; resize:vertical; min-height:64px; margin-bottom:16px; }
.sheet .sheet-actions{ display:flex; gap:10px; }
.sheet .sheet-actions .btn{ flex:1; }

/* ---- Error / info banner ---- */
.banner{ margin:0 16px 10px; padding:12px 14px; border-radius:var(--radius-md); font-size:13.5px; display:flex; gap:9px; align-items:flex-start; }
.banner.error{ background:var(--error-bg); color:var(--error-text); }
.banner.warn{ background:var(--gold-bg); color:var(--gold-text); }
.banner svg{ flex-shrink:0; margin-top:1px; }

/* ---- Toast ---- */
#toast-wrap{ position:fixed; left:0; right:0; bottom:18px; display:flex; flex-direction:column; align-items:center; gap:8px; z-index:80; pointer-events:none; }
.toast{ background:var(--green-dark); color:var(--cream); padding:11px 18px; border-radius:999px; font-size:13.5px; font-weight:600; display:flex; align-items:center; gap:8px; box-shadow:var(--shadow-e2); }
.toast.error{ background:var(--error); }

/* ---- Skeleton / loading ---- */
.skeleton-card{ background:var(--white); border:1px solid var(--border-tint); border-radius:var(--radius-lg); padding:14px 16px; height:76px; opacity:.6; }
.spinner{ width:16px; height:16px; border:2px solid rgba(255,255,255,.4); border-top-color:currentColor; border-radius:50%; animation:spin .7s linear infinite; }

.dev-note{ text-align:center; font-size:11px; color:var(--silver-light); padding:10px 16px 4px; }
</style>
</head>
<body>
<div class="app" id="app">

  <!-- ============== LOGIN ============== -->
  <div class="screen active" id="screen-login">
    <div class="login-screen">
      <div class="login-brand">
        <div class="mark">OP</div>
        <h1>OnePort 365 Field Channel</h1>
        <p>Sign in to see the milestones assigned to you.</p>
      </div>
      <div class="staff-list" id="staff-list"></div>
      <p class="dev-note">Demo build — standing in for the org's real authentication. Choosing a name below simulates signing in as that Operations Staff member.</p>
    </div>
  </div>

  <!-- ============== TO-DOS ============== -->
  <div class="screen" id="screen-todos">
    <div class="topbar">
      <h1>My To-Dos</h1>
      <button class="refresh-btn" id="btn-refresh" title="Refresh">
        <svg width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M21 12a9 9 0 11-3-6.7" stroke-linecap="round"></path><path d="M21 3v6h-6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>
      <button class="user-chip" id="btn-account"><span class="avatar" id="me-avatar"></span><span id="me-name"></span></button>
    </div>
    <div class="filter-bar" id="filter-bar"></div>
    <div id="todos-banner"></div>
    <div class="list" id="todos-list"></div>
  </div>

  <!-- ============== MILESTONE DETAIL ============== -->
  <div class="screen" id="screen-detail">
    <div class="topbar">
      <button class="back-btn" id="btn-back-detail"><svg width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.3" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"></path></svg></button>
      <h1>Milestone</h1>
    </div>
    <div id="detail-banner"></div>
    <div class="detail-body" id="detail-body"></div>
    <div class="bottom-bar" id="detail-action-bar"></div>
  </div>

</div>

<!-- ============== COMPLETION CONFIRM SHEET ============== -->
<div class="sheet-overlay" id="confirm-sheet">
  <div class="sheet">
    <div class="handle"></div>
    <h2>Mark milestone as complete?</h2>
    <p class="sheet-sub" id="confirm-sub"></p>
    <textarea id="confirm-note" placeholder="Completion note (optional)" maxlength="280"></textarea>
    <div class="sheet-actions">
      <button class="btn btn-outline" id="confirm-cancel">Cancel</button>
      <button class="btn btn-primary" id="confirm-complete">Complete</button>
    </div>
  </div>
</div>

<div id="toast-wrap"></div>

<script src="shared/milestone-store.js"></script>
<script>
'use strict';
const ME_KEY = 'oneport_field_channel_user';
const ICON_CHECK = '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5" stroke-linecap="round" stroke-linejoin="round"></path></svg>';
const ICON_CLOCK = '<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 3" stroke-linecap="round"></path></svg>';
const ICON_PIN = '<svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 21s7-6.6 7-12a7 7 0 10-14 0c0 5.4 7 12 7 12z"></path><circle cx="12" cy="9" r="2.4"></circle></svg>';
const ICON_WARN = '<svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 9v4M12 17h.01M10.3 3.86L1.8 18a2 2 0 001.7 3h17a2 2 0 001.7-3L13.7 3.86a2 2 0 00-3.4 0z" stroke-linecap="round" stroke-linejoin="round"></path></svg>';

const state = {
  me: null,
  filter: 'ALL',
  todos: [],
  currentMilestoneId: null,
  loadingTodos: false,
};

function el(id){ return document.getElementById(id); }
function showScreen(id){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', s.id===id)); }
function showToast(msg, type){
  const wrap = el('toast-wrap');
  const t = document.createElement('div');
  t.className = 'toast' + (type==='error' ? ' error' : '');
  t.innerHTML = (type==='error' ? ICON_WARN : ICON_CHECK) + `<span>${msg}</span>`;
  wrap.appendChild(t);
  setTimeout(()=>{ t.style.opacity='0'; t.style.transition='opacity .25s'; setTimeout(()=>t.remove(),250); }, 2800);
}
function initials(name){ return name.split(' ').map(p=>p[0]).slice(0,2).join('').toUpperCase(); }

/* ==========================================================================
   Auth (simulated) — stands in for the org's real login. A real build
   derives the acting user from the authenticated session/token; the
   client never gets to declare its own identity for a completion.
   ========================================================================== */
function renderLogin(){
  const staff = MilestoneStore.getOperationsStaff();
  el('staff-list').innerHTML = staff.map(u=>`
    <button class="staff-option" data-uid="${u.id}">
      <span class="avatar">${u.initials}</span>
      <span class="who"><div class="nm">${u.name}</div><div class="rl">${u.role}</div></span>
    </button>`).join('');
}
el('staff-list').addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-uid]');
  if(!btn) return;
  signIn(btn.dataset.uid);
});
function signIn(userId){
  state.me = MilestoneStore.getUserById(userId);
  localStorage.setItem(ME_KEY, userId);
  el('me-avatar').textContent = state.me.initials;
  el('me-name').textContent = state.me.name.split(' ')[0];
  goToTodos();
}
el('btn-account').addEventListener('click', ()=>{
  localStorage.removeItem(ME_KEY);
  state.me = null;
  showScreen('screen-login');
  renderLogin();
});

/* ==========================================================================
   To-Dos
   ========================================================================== */
function goToTodos(){
  showScreen('screen-todos');
  renderFilterBar();
  loadTodos();
}
function renderFilterBar(){
  const options = [['ALL','All'],['NOT_STARTED','Not Started'],['COMPLETED','Completed']];
  el('filter-bar').innerHTML = options.map(([key,label])=>
    `<button class="filter-chip ${state.filter===key?'active':''}" data-filter="${key}">${label}</button>`).join('');
}
el('filter-bar').addEventListener('click', (e)=>{
  const btn = e.target.closest('[data-filter]');
  if(!btn) return;
  state.filter = btn.dataset.filter;
  renderFilterBar();
  renderTodosList();
});

function dueMeta(dueDateIso){
  if(!dueDateIso) return {label:'No due date', cls:''};
  const due = new Date(dueDateIso);
  const now = new Date();
  const startOfDay = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const diffDays = Math.round((startOfDay(due) - startOfDay(now)) / 86400000);
  const time = due.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit',hour12:false});
  if(diffDays < 0) return {label:`Overdue · ${due.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}`, cls:'overdue'};
  if(diffDays === 0) return {label:`Due Today · ${time}`, cls:'today'};
  if(diffDays === 1) return {label:`Due Tomorrow · ${time}`, cls:''};
  return {label:`Due ${due.toLocaleDateString('en-GB',{day:'2-digit',month:'short'})}`, cls:''};
}

function loadTodos(){
  state.loadingTodos = true;
  el('btn-refresh').classList.add('spinning');
  el('todos-banner').innerHTML = '';
  MilestoneStore.getMyMilestones(state.me.id).then(items=>{
    state.todos = items;
    renderTodosList();
  }).catch(()=>{
    el('todos-banner').innerHTML = bannerHtml('error', 'Unable to load your To-Dos. Please check your connection and try again.');
  }).finally(()=>{
    state.loadingTodos = false;
    el('btn-refresh').classList.remove('spinning');
  });
}
el('btn-refresh').addEventListener('click', loadTodos);
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState==='visible' && state.me && el('screen-todos').classList.contains('active')) loadTodos();
});

function bannerHtml(kind, msg){
  return `<div class="banner ${kind}">${ICON_WARN}<span>${msg}</span></div>`;
}

function renderTodosList(){
  const filtered = state.todos.filter(({milestone})=>{
    if(state.filter==='ALL') return true;
    return milestone.status === state.filter;
  });

  if(!state.todos.length){
    el('todos-list').innerHTML = `
      <div class="empty-state">
        <div class="icon">${ICON_CHECK}</div>
        <h3>You're all caught up</h3>
        <p>There are no milestones assigned to you right now.</p>
      </div>`;
    return;
  }
  if(!filtered.length){
    el('todos-list').innerHTML = `
      <div class="empty-state">
        <div class="icon">${ICON_CLOCK}</div>
        <h3>Nothing here</h3>
        <p>No ${state.filter==='COMPLETED' ? 'completed milestones yet' : 'milestones in this view'}.</p>
      </div>`;
    return;
  }

  el('todos-list').innerHTML = filtered.map(({milestone:m, shipment:s})=>{
    const isDone = m.status==='COMPLETED';
    const due = dueMeta(m.dueDate);
    return `
    <button class="ms-card" data-open-ms="${m.id}">
      <div class="row1">
        <span class="ms-name">${m.name}</span>
        <span class="ship-ref">${s.jobRef}</span>
      </div>
      <div class="meta-row">
        <span>${s.serviceType || s.mode}</span>
        <span>·</span>
        <span>${ICON_PIN}${m.location}</span>
      </div>
      <div class="meta-row">
        <span class="status-pill ${isDone?'completed':'not-started'}">${isDone?ICON_CHECK+'Completed':'Not Started'}</span>
        ${!isDone ? `<span class="due-label ${due.cls}">${ICON_CLOCK} ${due.label}</span>` : ''}
      </div>
    </button>`;
  }).join('');
}
el('todos-list').addEventListener('click', (e)=>{
  const card = e.target.closest('[data-open-ms]');
  if(!card) return;
  openMilestoneDetail(card.dataset.openMs);
});

/* ==========================================================================
   Milestone Detail
   ========================================================================== */
function openMilestoneDetail(id){
  state.currentMilestoneId = id;
  showScreen('screen-detail');
  el('detail-banner').innerHTML = '';
  el('detail-body').innerHTML = `<div class="skeleton-card"></div>`;
  el('detail-action-bar').innerHTML = '';
  loadMilestoneDetail();
}
el('btn-back-detail').addEventListener('click', ()=>{
  goToTodos();
});

function loadMilestoneDetail(){
  MilestoneStore.getMilestone(state.currentMilestoneId).then(result=>{
    if(!result){
      el('detail-body').innerHTML = '';
      el('detail-banner').innerHTML = bannerHtml('warn', 'This milestone is no longer available.');
      el('detail-action-bar').innerHTML = `<button class="btn btn-outline" id="btn-back-empty">Back to To-Dos</button>`;
      el('btn-back-empty').addEventListener('click', goToTodos);
      return;
    }
    renderMilestoneDetail(result.milestone, result.shipment);
  }).catch(()=>{
    el('detail-body').innerHTML = '';
    el('detail-banner').innerHTML = bannerHtml('error', 'Unable to load this milestone. Please check your connection and try again.');
    el('detail-action-bar').innerHTML = `<button class="btn btn-outline" id="btn-retry-detail">Retry</button>`;
    el('btn-retry-detail').addEventListener('click', loadMilestoneDetail);
  });
}

function renderMilestoneDetail(m, s){
  const isDone = m.status === 'COMPLETED';
  const isMine = m.assignedTo === state.me.id;
  const due = dueMeta(m.dueDate);

  el('detail-banner').innerHTML = (!isDone && !isMine)
    ? bannerHtml('warn', 'This milestone is no longer assigned to you.')
    : '';

  el('detail-body').innerHTML = `
    <div class="detail-status-banner ${isDone?'completed':'not-started'}">
      ${isDone ? ICON_CHECK+' Completed' : ICON_CLOCK+' Not Started'}
    </div>
    <h2 class="detail-h1">${m.name}</h2>
    <p class="detail-sub">${s.jobRef} · ${s.customer}</p>

    <div class="info-card">
      <h3>Shipment</h3>
      <div class="info-row"><span class="k">Reference</span><span class="v">${s.jobRef}</span></div>
      <div class="info-row"><span class="k">Service</span><span class="v">${s.serviceType || s.mode}</span></div>
      <div class="info-row"><span class="k">Route</span><span class="v">${s.route}</span></div>
      <div class="info-row"><span class="k">Location</span><span class="v">${m.location}</span></div>
      ${!isDone ? `<div class="info-row"><span class="k">Due</span><span class="v">${due.label}</span></div>` : ''}
    </div>

    <div class="info-card">
      <h3>Instruction</h3>
      <p class="instruction-text">${m.instruction || 'No additional instruction provided for this milestone.'}</p>
    </div>

    ${isDone ? `
    <div class="info-card">
      <h3>Completion</h3>
      <p class="completion-meta">Completed by <b>${(MilestoneStore.getUserById(m.completedBy)||{}).name || 'Unknown'}</b><br>${new Date(m.completedAt).toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})}</p>
      ${m.completionNote ? `<div class="note-block">${m.completionNote}</div>` : ''}
    </div>` : ''}
  `;

  if(isDone){
    el('detail-action-bar').innerHTML = `<button class="btn btn-outline" id="btn-done-back">Back to To-Dos</button>`;
    el('btn-done-back').addEventListener('click', goToTodos);
  } else if(isMine){
    el('detail-action-bar').innerHTML = `<button class="btn btn-primary" id="btn-mark-complete">${ICON_CHECK} Mark as Complete</button>`;
    el('btn-mark-complete').addEventListener('click', ()=>openConfirmSheet(m, s));
  } else {
    el('detail-action-bar').innerHTML = `<button class="btn btn-outline" id="btn-refresh-detail">Refresh</button>`;
    el('btn-refresh-detail').addEventListener('click', loadMilestoneDetail);
  }
}

/* ==========================================================================
   Completion confirmation + mutation
   ========================================================================== */
function openConfirmSheet(m, s){
  el('confirm-sub').textContent = `${m.name} — ${s.jobRef}`;
  el('confirm-note').value = '';
  el('confirm-complete').disabled = false;
  el('confirm-complete').innerHTML = 'Complete';
  el('confirm-sheet').classList.add('open');
}
function closeConfirmSheet(){ el('confirm-sheet').classList.remove('open'); }
el('confirm-cancel').addEventListener('click', closeConfirmSheet);
el('confirm-sheet').addEventListener('click', (e)=>{ if(e.target.id==='confirm-sheet') closeConfirmSheet(); });

el('confirm-complete').addEventListener('click', ()=>{
  const note = el('confirm-note').value;
  const btn = el('confirm-complete');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Completing…';

  // Revalidate immediately before mutating — never trust the state the
  // screen was rendered with (spec section 28: backend is authoritative).
  MilestoneStore.getMilestone(state.currentMilestoneId).then(fresh=>{
    if(!fresh) return Promise.reject({code:'NOT_FOUND'});
    return MilestoneStore.completeMilestone(state.currentMilestoneId, state.me.id, note);
  }).then(res=>{
    closeConfirmSheet();
    if(!res.ok){
      handleCompletionError(res.code);
      return;
    }
    loadMilestoneDetail();
    showToast(res.alreadyCompleted ? 'This milestone has already been completed' : 'Milestone marked complete');
  }).catch(err=>{
    btn.disabled = false;
    btn.innerHTML = 'Complete';
    const code = err && err.code;
    if(code === 'NETWORK_ERROR'){
      showToast('Unable to update this milestone. Please check your connection and try again.', 'error');
    } else {
      closeConfirmSheet();
      handleCompletionError(code || 'NOT_FOUND');
    }
  });
});

function handleCompletionError(code){
  const messages = {
    FORBIDDEN: 'This milestone is no longer assigned to you.',
    NOT_FOUND: 'This milestone is no longer available.',
    UNAUTHENTICATED: 'You no longer have permission to update this milestone.',
  };
  showToast(messages[code] || 'Unable to update this milestone.', 'error');
  loadMilestoneDetail();
}

/* ==========================================================================
   Cross-channel revalidation — if the Admin Portal (or another tab)
   reassigns or completes a milestone, this app must reflect it rather
   than trusting whatever it last rendered.
   ========================================================================== */
MilestoneStore.subscribe(()=>{
  if(!state.me) return;
  if(el('screen-todos').classList.contains('active')) loadTodos();
  if(el('screen-detail').classList.contains('active')) loadMilestoneDetail();
});

/* ==========================================================================
   Boot
   ========================================================================== */
(function boot(){
  const savedId = localStorage.getItem(ME_KEY);
  const saved = savedId ? MilestoneStore.getUserById(savedId) : null;
  if(saved && !saved.isAdmin){
    state.me = saved;
    el('me-avatar').textContent = saved.initials;
    el('me-name').textContent = saved.name.split(' ')[0];
    goToTodos();
  } else {
    renderLogin();
  }
})();
</script>
</body>
